[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabulasense"
version = "0.1.0"
description = "テーブルの片付けと拭き上げを行うロボット TabulaSense のシミュレーション環境"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.5",
  "numpy>=1.26",
  "gymnasium>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", ".venv"]
